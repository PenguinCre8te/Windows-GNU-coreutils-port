name: Windows CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # e.g. v1.0.0
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup LLVM (host x64)
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Build ls.exe (x64)
        working-directory: ./ls
        run: make build ARCH=x64 OUTPUT=ls_x64.exe

      - name: Build rm.exe (x64)
        working-directory: ./rm
        run: make build ARCH=x64 OUTPUT=rm_x64.exe

      - name: Build ls.exe (arm64 cross)
        working-directory: ./ls
        run: make build ARCH=arm64 OUTPUT=ls_arm64.exe

      - name: Build rm.exe (arm64 cross)
        working-directory: ./rm
        run: make build ARCH=arm64 OUTPUT=rm_arm64.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            ls/ls_x64.exe
            rm/rm_x64.exe
            ls/ls_arm64.exe
            rm/rm_arm64.exe

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: ./dist

      - name: Verify binaries
        run: |
          dir dist
          if not exist dist\ls_x64.exe exit 1
          if not exist dist\rm_x64.exe exit 1
          if not exist dist\ls_arm64.exe exit 1
          if not exist dist\rm_arm64.exe exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ls_x64.exe
            dist/rm_x64.exe
            dist/ls_arm64.exe
            dist/rm_arm64.exe
          generate_release_notes: true