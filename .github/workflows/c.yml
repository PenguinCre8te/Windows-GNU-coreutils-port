name: Windows CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # e.g. v1.0.0
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]   # Build for both x86_64 and aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup LLVM
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: ${{ matrix.arch }}

      - name: Build ls.exe
        working-directory: ./ls
        run: make build ARCH=${{ matrix.arch }}

      - name: Build rm.exe
        working-directory: ./rm
        run: make build ARCH=${{ matrix.arch }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-${{ matrix.arch }}
          path: |
            ls/ls.exe
            rm/rm.exe

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries-x64
          path: ./dist/x64

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries-arm64
          path: ./dist/arm64

      - name: Verify binaries
        run: |
          dir dist\x64
          dir dist\arm64
          if not exist dist\x64\ls.exe exit 1
          if not exist dist\x64\rm.exe exit 1
          if not exist dist\arm64\ls.exe exit 1
          if not exist dist\arm64\rm.exe exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/x64/ls.exe
            dist/x64/rm.exe
            dist/arm64/ls.exe
            dist/arm64/rm.exe
          generate_release_notes: true
