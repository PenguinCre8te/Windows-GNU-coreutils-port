name: Windows CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # e.g. v1.0.0
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install llvm-mingw (ucrt-x86_64 bundle)
        run: |
          curl -L https://github.com/mstorsjo/llvm-mingw/releases/download/20251216/llvm-mingw-20251216-ucrt-x86_64.zip -o llvm-mingw.zip
          tar -xf llvm-mingw.zip
          echo "LLVM_MINGW=${{ github.workspace }}/llvm-mingw-20251216-ucrt-x86_64" >> $GITHUB_ENV
          echo "${{ github.workspace }}/llvm-mingw-20251216-ucrt-x86_64/bin" >> $GITHUB_PATH

      # Build x64
      - name: Build ls.exe (x64)
        working-directory: ./ls
        run: make ARCH=x86_64-w64-mingw32 OUTPUT=ls_x64.exe

      - name: Build rm.exe (x64)
        working-directory: ./rm
        run: make ARCH=x86_64-w64-mingw32 OUTPUT=rm_x64.exe

      # Build arm64 (cross-compile)
      - name: Build ls.exe (arm64)
        working-directory: ./ls
        run: make ARCH=aarch64-w64-mingw32 OUTPUT=ls_arm64.exe

      - name: Build rm.exe (arm64)
        working-directory: ./rm
        run: make ARCH=aarch64-w64-mingw32 OUTPUT=rm_arm64.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            ls/ls_x64.exe
            rm/rm_x64.exe
            ls/ls_arm64.exe
            rm/rm_arm64.exe

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: ./dist

      - name: Verify binaries
        run: |
          dir dist
          if not exist dist\ls_x64.exe exit 1
          if not exist dist\rm_x64.exe exit 1
          if not exist dist\ls_arm64.exe exit 1
          if not exist dist\rm_arm64.exe exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ls_x64.exe
            dist/rm_x64.exe
            dist/ls_arm64.exe
            dist/rm_arm64.exe
          generate_release_notes: true